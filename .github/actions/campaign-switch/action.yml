name: 'Campaign switch'
description: >
  Roda o script de switch de turma da LP e, se commitou algo, dispara
  redeploy no Coolify via API (POST com Bearer).

inputs:
  switch-script:
    description: 'Caminho (relativo à raiz do repo da LP) do script Node que aplica o switch'
    required: false
    default: 'scripts/campaign-switch.mjs'
  node-version:
    description: 'Versão do Node pra rodar o script'
    required: false
    default: '20'
  coolify-deploy-url:
    description: >
      URL completa da API de deploy do Coolify, incluindo o UUID da app como
      query param. Formato: http(s)://<host>/api/v1/deploy?uuid=<UUID>&force=false
    required: false
    default: ''
  coolify-token:
    description: 'API token do Coolify (scope root — enviado como Bearer)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Pre-switch HEAD
      id: pre
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Rodar script de switch
      shell: bash
      run: node "${{ inputs.switch-script }}"

    - name: Post-switch HEAD
      id: post
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Dispara deploy no Coolify
      if: steps.pre.outputs.sha != steps.post.outputs.sha && inputs.coolify-deploy-url != '' && inputs.coolify-token != ''
      shell: bash
      env:
        DEPLOY_URL: ${{ inputs.coolify-deploy-url }}
        TOKEN:      ${{ inputs.coolify-token }}
      run: |
        set -euo pipefail
        http_code=$(curl -sS -o /tmp/out -w "%{http_code}" \
          -X POST "$DEPLOY_URL" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/json")
        echo "HTTP $http_code"
        head -c 500 /tmp/out || true
        echo
        case "$http_code" in
          2??) echo "deploy disparado." ;;
          *)   echo "falhou — rebuild manual no Coolify."; exit 1 ;;
        esac

    - name: Status final (sem deploy)
      if: steps.pre.outputs.sha == steps.post.outputs.sha || inputs.coolify-deploy-url == '' || inputs.coolify-token == ''
      shell: bash
      run: |
        if [ "${{ steps.pre.outputs.sha }}" = "${{ steps.post.outputs.sha }}" ]; then
          echo "Sem commit novo — nada a deployar."
        else
          echo "Commit feito, mas secrets Coolify ausentes — rebuild manual no dashboard."
        fi
