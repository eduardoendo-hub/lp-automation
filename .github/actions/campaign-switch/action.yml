name: 'Campaign switch'
description: >
  Roda o script de switch de turma da LP (que vive dentro de cada repo de LP)
  e, se algo foi commitado, dispara redeploy no Coolify via webhook de deploy
  da app.

inputs:
  switch-script:
    description: 'Caminho (relativo à raiz do repo da LP) do script Node que aplica o switch'
    required: false
    default: 'scripts/campaign-switch.mjs'
  node-version:
    description: 'Versão do Node pra rodar o script'
    required: false
    default: '20'
  coolify-deploy-webhook:
    description: >
      URL completa do deploy webhook da app no Coolify. A URL inteira é o
      segredo — nao usa Bearer. Encontrada no Coolify em: app → Webhooks (ou
      Resource Operations). Se vazio, o deploy e' pulado (commit fica mas
      rebuild precisa ser manual).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Pre-switch HEAD
      id: pre
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Rodar script de switch
      shell: bash
      run: node "${{ inputs.switch-script }}"

    - name: Post-switch HEAD
      id: post
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Dispara deploy no Coolify (webhook)
      if: steps.pre.outputs.sha != steps.post.outputs.sha && inputs.coolify-deploy-webhook != ''
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.coolify-deploy-webhook }}
      run: |
        set -euo pipefail
        http_code=$(curl -sS -o /tmp/out -w "%{http_code}" "$WEBHOOK_URL")
        echo "HTTP $http_code"
        head -c 500 /tmp/out || true
        echo
        case "$http_code" in
          2??) echo "deploy disparado." ;;
          *)   echo "falhou — rebuild manual no Coolify."; exit 1 ;;
        esac

    - name: Status final (sem deploy)
      if: steps.pre.outputs.sha == steps.post.outputs.sha || inputs.coolify-deploy-webhook == ''
      shell: bash
      run: |
        if [ "${{ steps.pre.outputs.sha }}" = "${{ steps.post.outputs.sha }}" ]; then
          echo "Sem commit novo — nada a deployar."
        else
          echo "Commit feito, mas secret coolify-deploy-webhook ausente — rebuild manual no dashboard."
        fi
